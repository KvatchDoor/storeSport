spring.application.name=sportStore
server.port=8080

# --- Base H2 en memoire ---
spring.datasource.url=jdbc:h2:mem:sportstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Jeu de donnees initial : data.sql est joue apres la creation du schema par Hibernate ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Console H2 : http://localhost:8080/h2-console (JDBC URL : jdbc:h2:mem:sportstore) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
