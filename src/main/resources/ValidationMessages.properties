# Messages des contraintes Bean Validation portees par les DTO generes depuis le contrat OpenAPI.
#
# Sans ce fichier, Hibernate Validator resout ses messages par defaut dans la locale du serveur :
# le corps des reponses 400 changerait d'une machine a l'autre. Les figer ici garantit que le
# contrat d'erreur de l'API est le meme partout, sans dupliquer les contraintes elles-memes
# (elles restent declarees une seule fois, dans sportstore-api.yaml).
jakarta.validation.constraints.NotNull.message=must not be null
jakarta.validation.constraints.Size.message=size must be between {min} and {max}
jakarta.validation.constraints.DecimalMin.message=must be greater than or equal to {value}
